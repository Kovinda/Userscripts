              - paragraph [ref=f10e76]: "Title: 그래서 나는 안티팬과 결혼했다 / So I Married the Anti-Fan Genre: Romance, Comedy Episodes: 16 Broadcast network: Naver TV Broadcast period: 2021-Apr-30 to 2021-Jun-19 Air time: Friday & Saturday 18:00 KST"
            - paragraph [ref=f10e83]: Hoo-Joon (Choi Tae-Joon) is a top star. Geun-Young (Sooyoung) is a magazine reporter. For potential news material, Geun-Young decides to attend an opening ceremony for a club. There, she witnesses top star Hoo-Joon’s violent behavior and she also vomits on him by accident. This leads to Geun-Young losing her job. Geun-Young believes Hoo-Joon was behind her firing and she decides to do something about it. Every day, Geun-Young demonstrates in front of Ho-Joon’s management office. She begins to receive media coverage on her demonstration and soon Geun-Young becomes famous as an anti-fan. A PD approaches Geun-Young about participating in a reality TV show. The concept for the show revolves around a top star and their anti-fan living together. Geun-Young is in financial difficulties and accepts the offer. Meanwhile, Hoo-Joon is offered the same reality TV show and he accepts to improve his image. Ho-Joon and Geun-Young try to give each other a hard time on the TV program, but they become attracted to each other.
